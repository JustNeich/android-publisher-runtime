[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android-publisher"
version = "1.0.0rc3"
description = "Local Android YouTube publisher with Telegram approvals and Codex"
requires-python = ">=3.11"
dependencies = ["telethon==1.45.0"]

[project.optional-dependencies]
provision = ["telethon==1.45.0"]

[project.scripts]
android-publisher = "publisher.cli:main"

[tool.setuptools.packages.find]
include = ["publisher*"]
